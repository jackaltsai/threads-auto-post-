name = "threads-auto-post"
main = "src/index.js"
compatibility_date = "2026-06-01"

# 自訂網域路由：讓 heartchen.com/privacy 由本 Worker 提供隱私政策頁面
# 其他 heartchen.com 路徑不受影響（仍走原本綁定的 Worker）
# 前提：heartchen.com 這個 zone 已加入同一個 Cloudflare 帳號
[[routes]]
pattern = "heartchen.com/privacy"
zone_name = "heartchen.com"

# Cron 排程設定 (UTC 時間)
# 範例：每天台灣時間早上 9 點發文 = UTC 凌晨 1 點
[triggers]
crons = [
  "0 1 * * *",   # 每天台灣時間 09:00 自動發文
  # "0 15 * * *",  # 搜尋「失眠」互動：需 Tech Provider + 進階存取權才能搜全平台，暫時停用
]

# 機密變數請用 wrangler secret put 設定，不要寫在這裡：
#   wrangler secret put THREADS_USER_ID
#   wrangler secret put THREADS_ACCESS_TOKEN
#   wrangler secret put LINE_CHANNEL_SECRET
#   wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
